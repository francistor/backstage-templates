name: ${{values.app_name}}-cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Where are we
        shell: bash
        run: |
          pwd 
          ls
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ '${{ secrets.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}

      -
        name: Shorten commit id
        shell: bash 
        run: |
          echo COMMIT_ID="${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: francistor/${{values.app_name}}:${{ '${{ env.COMMIT_ID }}' }}
    outputs:
      commit_id: ${{ '${{ env.COMMIT_ID }}' }}
  cd:
    runs-on: local-kind
    needs: ci
    steps:
      - name: clone repo
        uses: actions/checkout@v3

      - name: Install argocd
        shell: bash
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Get commit id
        shell: bash
        run: |
          sed -i "s/.*tag:.*/  tag: ${{ '${{ needs.ci.outputs.commit_id }}' }}/" charts/${{values.app_name}}/values.yaml

      - name: commit to github 
        uses: EndBug/add-and-commit@v9
        with:
          author_name: francistor
          autor_email: francisco.cardosogil@gmail.com
          message: update tag

      - name: Ensure repo
        shell: bash
        run: |
          REPO='https://github.com/francistor-organization/${{values.app_name}}'
          
          argocd login argocd-server.argocd --insecure --username admin --password ${{ '${{ secrets.ARGOCD_PASSWORD }}' }}
          argocd repo list | grep -q $REPO || \
          argocd repo add $REPO
          
          argocd app get ${{values.app_name}} || \
          argocd app create ${{values.app_name}} \
            --repo $REPO \
            --chart charts/${{values.app_name}} \
            --dest-namespace ${{values.namespace}} \\
            --dest-server https://kubernetes.default.svc \\
            --values values-${{values.app_env}} \\
            --revision master \\
            --sync-policy manual \\
            --sync-option CreateNamespace=true

      - name: Deploy to argocd
        shell: bash 
        run: |
          argocd login argocd-server.argocd --insecure --username admin --password ${{ '${{ secrets.ARGOCD_PASSWORD }}' }}
          argocd app sync ${{values.app_name}}
          argocd app wait ${{values.app_name}} --timeout 180